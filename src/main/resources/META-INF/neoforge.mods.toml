modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Maxezify/EnderPortalsMod/issues"

[[mods]]
modId = "enderportals"
version = "${version}"
displayName = "Ender Portals"
authors = "Maxezify"
description = '''
La Porte de l'Ender : un minerai de l'End, une clé dorée, et tout un monde-caverne — le paradis des blocs — caché derrière votre porte de poche.
'''
logoFile = "assets/enderportals/icon.png"

[[dependencies.enderportals]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.enderportals]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.enderportals]]
modId = "imm_ptl"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Rangements : compat via la capability IItemHandler (aucune dépendance de
# compilation). Ces déclarations optionnelles ne servent qu'à l'ordre de
# chargement — le Centraliseur les charge après pour exposer/lire leur réseau.
[[dependencies.enderportals]]
modId = "sophisticatedstorage"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.enderportals]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.enderportals]]
modId = "toms_storage"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
