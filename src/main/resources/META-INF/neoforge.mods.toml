modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Maxezify/EnderPortalsMod/issues"

[[mods]]
modId = "enderportals"
version = "${version}"
displayName = "World of Ender"
authors = "Maxezify"
description = '''
Le joueur a le Nether sous l'Overworld ; l'Enderman a l'Ender sous l'End. Une porte d'obsidienne, une clé dorée, et tout un monde-caverne — le paradis des cubes, où la matière détruite vient se reposer.
'''
logoFile = "assets/enderportals/icon.png"

[[dependencies.enderportals]]
modId = "neoforge"
type = "required"
# 21.1.238 est le build qui a introduit TooltipFlag#shouldDisplayAllInformation,
# dont EnderTooltip se sert pour livrer aux visualiseurs de recettes le mode
# d'emploi replié derrière Maj. En deçà, la méthode n'existe pas et le survol
# d'un objet lèverait NoSuchMethodError : le plancher est donc réel, pas
# prudentiel.
versionRange = "[21.1.238,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.enderportals]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Immersive Portals : intégration facultative, par réflexion. Les deux modIds
# sont déclarés — la version NeoForge officielle et ses forks n'utilisent pas
# le même — pour que le mod soit toujours chargé après lui.
[[dependencies.enderportals]]
modId = "imm_ptl"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.enderportals]]
modId = "immersive_portals_core"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Rangements : compat via la capability IItemHandler (aucune dépendance de
# compilation). Ces déclarations optionnelles ne servent qu'à l'ordre de
# chargement — le Centraliseur les charge après pour exposer/lire leur réseau.
[[dependencies.enderportals]]
modId = "sophisticatedstorage"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.enderportals]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.enderportals]]
modId = "toms_storage"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
