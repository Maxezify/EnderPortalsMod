name: Build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jar (artefact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enderportals-jar
          path: build/libs/*.jar

      - name: Release de développement (jar téléchargeable)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create dev-latest build/libs/enderportals-*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Build de développement" \
            --notes "Jar compilé automatiquement depuis ${GITHUB_SHA}."
