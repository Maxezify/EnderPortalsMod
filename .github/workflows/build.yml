name: Build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le datapack n'est lu qu'au chargement du monde : une erreur de forme y
      # est invisible à la compilation et ne se découvre qu'en jeu, sous la
      # forme d'une recette qui n'existe pas.
      - name: Vérifier les fichiers de données
        run: python3 tools/check_data.py

      # Deux caisses alignées scintillent en jeu et nulle part ailleurs : ni la
      # compilation ni les textures ne peuvent le dire.
      - name: Vérifier la coque du téléporteur
        run: python3 tools/check_hull.py

      # Un README se périme en silence : on change un coût, on oublie la
      # documentation, et un joueur suit une instruction fausse. Les chiffres
      # documentés sont donc relus depuis les constantes et les recettes.
      - name: Vérifier les README
        run: python3 tools/check_readme.py

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      # Diagnostic temporaire (0.33.0). Waystones déplace le joueur par
      # Entity#teleportTo, que NeoForge ne patche pas : la couche de prévention
      # du garde-fou ne peut donc rien voir. Reste à savoir si vanilla y appelle
      # changeDimension — c'est la seule façon d'établir ce que cette couche
      # couvre vraiment, et les sources ne sont lisibles que sur ce runner.
      # À retirer une fois la réponse consignée.
      - name: Diagnostic — Entity#teleportTo passe-t-il par changeDimension ?
        if: always()
        continue-on-error: true
        run: |
          set +e
          JAR=""
          for candidate in $(find "$HOME/.gradle" build -name '*.jar' 2>/dev/null | grep -iE 'neoforge|minecraft|joined' | head -60); do
            if unzip -l "$candidate" 2>/dev/null | grep -q 'net/minecraft/world/entity/Entity.class'; then
              JAR="$candidate"; break
            fi
          done
          echo "jar retenu : ${JAR:-aucun}"
          [ -z "$JAR" ] && exit 0
          mkdir -p /tmp/mc
          unzip -o -q "$JAR" 'net/minecraft/world/entity/Entity.class' \
                             'net/minecraft/server/level/ServerPlayer.class' -d /tmp/mc
          for c in world/entity/Entity server/level/ServerPlayer; do
            f="/tmp/mc/net/minecraft/$c.class"
            [ -f "$f" ] || continue
            javap -p -c "$f" > "/tmp/$(basename $c).txt" 2>/dev/null
            python3 - "$c" "/tmp/$(basename $c).txt" <<'PY'
          import re, sys
          name, path = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?=  [a-zA-Z@])", text)
          print(f"================ {name}")
          for b in blocks:
              head = b.strip().splitlines()[0] if b.strip() else ""
              if "teleportTo" not in head:
                  continue
              print("---", head)
              calls = sorted(set(re.findall(r"// (?:Method|InterfaceMethod) ([\w/$.]+):", b)))
              print("    appelle :", ", ".join(c for c in calls
                                               if "changeDimension" in c or "teleport" in c
                                               or "moveTo" in c or "Hooks" in c) or "(rien de notable)")
          PY
          done

      - name: Upload jar (artefact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enderportals-jar
          path: build/libs/*.jar

      - name: Release de développement (jar téléchargeable)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create dev-latest build/libs/enderportals-*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Build de développement" \
            --notes "Jar compilé automatiquement depuis ${GITHUB_SHA}."
